.glow{animation:glow 3.2s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.35}50%{opacity:1}}
.blink{transform-box:fill-box;transform-origin:center top;animation:blink 5.5s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(0)}95%{transform:scaleY(1)}}
.drift{animation:drift 9s ease-in-out infinite}
@keyframes drift{0%,100%{transform:translate(0,0)}25%{transform:translate(14px,-10px)}50%{transform:translate(4px,-22px)}75%{transform:translate(-12px,-8px)}}
