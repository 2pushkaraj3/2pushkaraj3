<circle cx="-11.6" cy="-9.6" r="1.4" fill="#fff"/><circle cx="14.4" cy="-9.6" r="1.4" fill="#fff"/>
<ellipse class="blink" cx="-13" cy="-15" rx="8.5" ry="15" fill="#5E4E8C"/><ellipse class="blink" cx="13" cy="-15" rx="8.5" ry="15" fill="#5E4E8C"/>
<polygon points="-4.5,1 4.5,1 0,9" fill="#FF9F43"/>
</g></g>
<text x="142" y="56" class="d rise" font-size="34" fill="#F3EBD3">About me</text>
<path class="draw" style="--len:167" d="M144 70 h163" stroke="#FFC857" stroke-width="3" stroke-linecap="round" stroke-dasharray="167" opacity=".9"/>
<text x="144" y="94" class="b rise" style="animation-delay:.25s" font-size="16" fill="#A99BFF">The night owl who asks why the number moved</text>
<g class="drift" style="animation-delay:0s;animation-duration:7.9s"><g class="glow" style="animation-delay:0s"><circle cx="930" cy="46" r="8.2" fill="#FFC857" opacity=".18"/><circle cx="930" cy="46" r="2.4" fill="#FFC857"/></g></g>
</svg>