<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 120" width="1000" height="120" role="img" aria-label="About me">
<defs><style>@font-face{font-family:'FrauncesE';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'NunitoE';src:url(data:font/woff2;base64,) format('woff2');}
.d{font-family:'FrauncesE',Georgia,serif;font-weight:700}
.b{font-family:'NunitoE','Segoe UI',Helvetica,Arial,sans-serif;font-weight:700}
.tw{animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
.glow{animation:glow 3.2s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.35}50%{opacity:1}}
.blink{transform-box:fill-box;transform-origin:center top;animation:blink 5.5s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(0)}95%{transform:scaleY(1)}}
.drift{animation:drift 9s ease-in-out infinite}
@keyframes drift{0%,100%{transform:translate(0,0)}25%{transform:translate(14px,-10px)}50%{transform:translate(4px,-22px)}75%{transform:translate(-12px,-8px)}}
.bob{animation:bob 2.8s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.speed{animation:speed 1.1s linear infinite}
@keyframes speed{0%{transform:translateX(8px);opacity:0}30%{opacity:1}100%{transform:translateX(-12px);opacity:0}}
.swing{transform-box:fill-box;transform-origin:50% 0;animation:swing 3.4s ease-in-out infinite}
@keyframes swing{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(10deg)}}
.twitch{transform-box:fill-box;transform-origin:50% 100%;animation:twitch 4.2s infinite}
@keyframes twitch{0%,86%,100%{transform:rotate(0)}90%{transform:rotate(-16deg)}94%{transform:rotate(7deg)}}
.wink{transform-box:fill-box;transform-origin:center top;animation:blink 4.6s infinite 1.3s}
.spark{transform-box:fill-box;transform-origin:center;animation:spark 2.2s ease-in-out infinite}
@keyframes spark{0%,100%{transform:scale(.25);opacity:.2}50%{transform:scale(1);opacity:1}}
.flap{transform-box:fill-box;transform-origin:50% 100%;animation:flap .16s ease-in-out infinite alternate}
@keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(.5)}}
.tilt{transform-box:fill-box;transform-origin:50% 100%;animation:tilt 7s ease-in-out infinite}
@keyframes tilt{0%,70%,100%{transform:rotate(0)}76%{transform:rotate(-8deg)}84%{transform:rotate(-8deg)}90%{transform:rotate(3deg)}}
.halo{transform-box:fill-box;transform-origin:center;animation:halo 5s ease-in-out infinite}
@keyframes halo{0%,100%{transform:scale(1);opacity:.75}50%{transform:scale(1.08);opacity:1}}
.shoot{animation:shoot var(--d,11s) linear infinite;animation-delay:var(--w,0s);opacity:0}
@keyframes shoot{0%{transform:translate(0,0);opacity:0}2%{opacity:1}9%{transform:translate(-260px,120px);opacity:0}100%{transform:translate(-260px,120px);opacity:0}}
.rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.draw{animation:draw 1.1s ease-out .35s both}
@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
.hop{animation:hop 5s ease-in-out infinite}
@keyframes hop{0%,16%,100%{transform:translateY(0)}8%{transform:translateY(-12px)}}
.pop{animation:pop .55s cubic-bezier(.2,.7,.2,1) both}
@keyframes pop{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.fr{opacity:0;animation:fr .11s linear 1}
@keyframes fr{0%,100%{opacity:1}}
.fin{animation:fin .01s linear both}
@keyframes fin{from{opacity:0}to{opacity:1}}
.grow{transform-box:fill-box;transform-origin:0 50%;animation:grow 1.1s cubic-bezier(.2,.7,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.fade{animation:fin .5s ease-out both}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.shoot{opacity:0}}
</style><linearGradient id="tail" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#F3EBD3" stop-opacity="0"/></linearGradient>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1A2349"/><stop offset="1" stop-color="#121735"/></linearGradient>
<clipPath id="bc"><rect x="1" y="1" width="998" height="118" rx="20"/></clipPath></defs>
<rect x="1" y="1" width="998" height="118" rx="20" fill="url(#bg)" stroke="#2A3563" stroke-width="1.5"/>
<g clip-path="url(#bc)"><circle class="tw" style="animation-delay:1.90s" cx="720" cy="41" r="1.0" fill="#F3EBD3"/><circle class="tw" style="animation-delay:0.02s" cx="774" cy="50" r="0.8" fill="#F3EBD3"/><circle class="tw" style="animation-delay:0.17s" cx="744" cy="42" r="0.6" fill="#F3EBD3"/><circle class="tw" style="animation-delay:2.34s" cx="802" cy="29" r="1.0" fill="#F3EBD3"/><circle class="tw" style="animation-delay:2.86s" cx="923" cy="63" r="1.2" fill="#F3EBD3"/><circle class="tw" style="animation-delay:3.94s" cx="825" cy="36" r="0.7" fill="#F3EBD3"/><circle class="tw" style="animation-delay:0.18s" cx="916" cy="61" r="1.2" fill="#F3EBD3"/><circle class="tw" style="animation-delay:2.94s" cx="961" cy="60" r="1.2" fill="#F3EBD3"/><circle class="tw" style="animation-delay:2.02s" cx="758" cy="52" r="1.2" fill="#F3EBD3"/><circle class="tw" style="animation-delay:2.34s" cx="937" cy="76" r="1.2" fill="#F3EBD3"/><g class="shoot" style="--d:12.414476847502502s;--w:5.159956811795673s"><line x1="980" y1="18" x2="1034" y2="-7" stroke="url(#tail)" stroke-width="2.2" stroke-linecap="round"/><circle cx="980" cy="18" r="2.2" fill="#fff"/></g></g>
<path d="M640 119 C 720 96 820 104 999 88 L999 99 Q999 119 979 119 Z" fill="#1C2F45" opacity=".7"/>
