<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 120" width="1000" height="120" role="img" aria-label="The journey">
<defs><style>@font-face{font-family:'FrauncesE';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'NunitoE';src:url(data:font/woff2;base64,) format('woff2');}
.d{font-family:'FrauncesE',Georgia,serif;font-weight:700}
.b{font-family:'NunitoE','Segoe UI',Helvetica,Arial,sans-serif;font-weight:700}
.tw{animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
.glow{animation:glow 3.2s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.35}50%{opacity:1}}
.blink{transform-box:fill-box;transform-origin:center top;animation:blink 5.5s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(0)}95%{transform:scaleY(1)}}
.drift{animation:drift 9s ease-in-out infinite}
@keyframes drift{0%,100%{transform:translate(0,0)}25%{transform:translate(14px,-10px)}50%{transform:translate(4px,-22px)}75%{transform:translate(-12px,-8px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1A2349"/><stop offset="1" stop-color="#121735"/></linearGradient></defs>
